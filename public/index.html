<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Local Business Network — discover local businesses, products, stories, B2B requirements, events and knowledge in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Vartha Business Network</title>

    <!--
      Google Website Translator: translates content that comes back from the API
      (stories, products, resource categories...) in BOTH directions.

      The widget can only translate *away from* the language it believes the page is
      written in, so we tell it the opposite of what the visitor asked for:
        viewing Tamil   -> cookie /en/ta, page treated as English  (English text -> Tamil)
        viewing English -> cookie /ta/en, page treated as Tamil    (Tamil text   -> English)
      Text that is already in the target language passes through untouched, so content
      written in either language ends up correct. Static UI text is handled separately
      by /i18n/*.json (see LanguageContext.jsx).
    -->
    <script type="text/javascript">
      (function () {
        // Expire "googtrans" on every scope it might live in. On production Google
        // also writes a domain-scoped copy (.yourdomain.com) that a plain host-only
        // write cannot overwrite, so always wipe them all before writing a new value.
        window.__clearGoogTrans = function () {
          var host = location.hostname;
          var parts = host.split(".");
          var domains = [undefined, host, "." + host];
          for (var i = 1; i < parts.length - 1; i++) domains.push("." + parts.slice(i).join("."));
          domains.forEach(function (d) {
            document.cookie =
              "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/" + (d ? "; domain=" + d : "");
          });
        };
        var saved = null;
        try { saved = localStorage.getItem("vartha_lang"); } catch (e) {}
        var lang = saved === "en" ? "en" : "ta"; // Tamil is the default for first-time visitors
        window.__clearGoogTrans();
        document.cookie = (lang === "en" ? "googtrans=/ta/en" : "googtrans=/en/ta") + ";path=/";
        window.__pageLang = lang === "en" ? "ta" : "en";
      })();
      function googleTranslateElementInit() {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: window.__pageLang || "en",
            includedLanguages: "en,ta",
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Mount point the translate widget needs (kept off-screen, not display:none) -->
    <div id="google_translate_element" class="notranslate" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"></div>
  </body>
</html>
