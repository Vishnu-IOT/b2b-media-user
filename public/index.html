<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="Local Business Network — discover local businesses, products, stories, B2B requirements, events and knowledge in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Vartha Business Network</title>
    <!-- Default share-preview tags; ShareButton overrides them per post while a post is open -->
    <meta property="og:site_name" content="Vartha Business Network" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vartha Business Network" />
    <meta name="twitter:card" content="summary_large_image" />

      <!-- Start downloading the UI text immediately, in parallel with the JavaScript bundle -->
    <link rel="preload" href="%PUBLIC_URL%/i18n/ta.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <link rel="preload" href="%PUBLIC_URL%/i18n/en.json" as="fetch" type="application/json" crossorigin="anonymous" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
