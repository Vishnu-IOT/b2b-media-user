<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F3EC" />
    <meta
      name="description"
      content="Local Business Network — discover local businesses, products, stories, B2B requirements, events and knowledge in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vartha Business Network</title>

    <!--
      Google Website Translator: translates the whole rendered page,
      including dynamic post content, into whichever language is selected.
      We default first-time visitors to Tamil by pre-setting the "googtrans"
      cookie before the widget boots; once someone picks a language from the
      dropdown, their choice is remembered on future visits.
    -->
    <script type="text/javascript">
      (function () {
        if (!document.cookie.includes("googtrans=")) {
          document.cookie = "googtrans=/en/ta;path=/";
        }
      })();
      function googleTranslateElementInit() {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,ta",
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
